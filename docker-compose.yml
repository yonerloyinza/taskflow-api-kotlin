services:
  api-kotlin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-api-kotlin
    restart: unless-stopped
    env_file:
      - /opt/taskflow/.env.kotlin
    environment:
      - KTOR_ENV=production
      - PORT=3000
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-kotlin.rule=Host(`taskflow-api-kotlin.xprad.com`)"
      - "traefik.http.routers.api-kotlin.entrypoints=websecure"
      - "traefik.http.routers.api-kotlin.tls.certresolver=lets-encrypt"
      - "traefik.http.services.api-kotlin.loadbalancer.server.port=3000"
      - "traefik.http.routers.api-kotlin.middlewares=secHeaders@file"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q taskflow-api-kotlin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - public

networks:
  public:
    external: true